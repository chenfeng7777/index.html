<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浙江高考数学 · 四周速成计划</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --red: #e63946;
    --gold: #f4a261;
    --navy: #1d3557;
    --blue: #457b9d;
    --light: #a8dadc;
    --bg: #f1faee;
    --white: #ffffff;
    --gray: #6b7280;
    --card: #ffffff;
  }

  body {
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
  }

  /* === STARS BACKGROUND === */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 30px 20px 60px;
  }

  /* === HEADER === */
  .header {
    text-align: center;
    margin-bottom: 36px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 500;
    color: rgba(255,255,255,0.7);
    letter-spacing: 3px;
    margin-bottom: 4px;
  }
  .header .subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 2px;
  }

  /* === SECTION 1: COUNTDOWN === */
  .countdown-section {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 36px 24px 30px;
    text-align: center;
    margin-bottom: 24px;
    backdrop-filter: blur(10px);
    position: relative;
    overflow: hidden;
  }
  .countdown-section::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at center, rgba(230,57,70,0.08) 0%, transparent 60%);
    pointer-events: none;
  }
  .exam-label {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .exam-date {
    font-size: 17px;
    color: #f4a261;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 24px;
  }
  .countdown-grid {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .cd-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .cd-num {
    font-size: 64px;
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(180deg, #ffffff 0%, #e63946 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    min-width: 80px;
  }
  .cd-sep {
    font-size: 50px;
    font-weight: 900;
    color: rgba(255,255,255,0.3);
    margin-top: -6px;
    line-height: 1;
  }
  .cd-label {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 1px;
  }
  .progress-bar-wrap {
    background: rgba(255,255,255,0.1);
    border-radius: 999px;
    height: 6px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #e63946, #f4a261);
    border-radius: 999px;
    transition: width 0.5s ease;
  }
  .progress-text {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    margin-top: 8px;
  }

  /* === SECTION 2 & 3: BUTTONS === */
  .buttons-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }
  .btn-card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 18px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    backdrop-filter: blur(8px);
    user-select: none;
  }
  .btn-card:hover {
    background: rgba(255,255,255,0.13);
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }
  .btn-card:active { transform: translateY(-1px); }
  .btn-card.today { border-color: rgba(230,57,70,0.5); }
  .btn-card.full { border-color: rgba(244,162,97,0.5); }
  .btn-icon { font-size: 32px; margin-bottom: 10px; }
  .btn-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .btn-card.today .btn-title { color: #ff6b7a; }
  .btn-card.full .btn-title { color: #f4a261; }
  .btn-desc { font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.5; }

  /* === MODAL === */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 100;
    backdrop-filter: blur(4px);
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #1a1a2e;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 28px 28px 0 0;
    padding: 8px 0 0;
    width: 100%;
    max-width: 780px;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-handle {
    width: 40px; height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .modal-title { font-size: 18px; font-weight: 700; }
  .modal-close {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: none;
    color: rgba(255,255,255,0.7);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .modal-close:hover { background: rgba(255,255,255,0.2); }
  .modal-body {
    padding: 20px 24px 32px;
    overflow-y: auto;
    flex: 1;
  }

  /* === TODAY PLAN CONTENT === */
  .day-badge {
    display: inline-block;
    background: linear-gradient(135deg, #e63946, #c1121f);
    border-radius: 12px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }
  .day-date {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 20px;
  }
  .time-block {
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 14px;
    border-left: 3px solid;
  }
  .time-block.morning { border-color: #f4a261; }
  .time-block.afternoon { border-color: #457b9d; }
  .time-block-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 12px;
    opacity: 0.7;
  }
  .time-block.morning .time-block-title { color: #f4a261; }
  .time-block.afternoon .time-block-title { color: #a8dadc; }
  .task-item {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 14px;
    line-height: 1.6;
    color: rgba(255,255,255,0.85);
  }
  .task-item:last-child { margin-bottom: 0; }
  .task-emoji { flex-shrink: 0; font-size: 16px; }
  .tip-box {
    background: rgba(244,162,97,0.1);
    border: 1px solid rgba(244,162,97,0.25);
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 16px;
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    line-height: 1.7;
  }
  .tip-box strong { color: #f4a261; }
  .no-plan {
    text-align: center;
    padding: 40px 20px;
    color: rgba(255,255,255,0.5);
    font-size: 15px;
    line-height: 2;
  }

  /* === FULL PLAN CONTENT === */
  .week-section {
    margin-bottom: 28px;
  }
  .week-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .week-num {
    background: linear-gradient(135deg, #f4a261, #e63946);
    border-radius: 10px;
    padding: 4px 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    flex-shrink: 0;
  }
  .week-title { font-size: 16px; font-weight: 700; }
  .week-focus { font-size: 12px; color: rgba(255,255,255,0.5); margin-left: auto; }
  .day-row {
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 12px;
    align-items: start;
    cursor: pointer;
    transition: background 0.2s;
    border: 1px solid transparent;
  }
  .day-row:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.1);
  }
  .day-row.is-today {
    border-color: rgba(230,57,70,0.5);
    background: rgba(230,57,70,0.08);
  }
  .day-num-label {
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.4);
    padding-top: 2px;
  }
  .day-row.is-today .day-num-label { color: #ff6b7a; }
  .day-date-label {
    font-size: 10px;
    color: rgba(255,255,255,0.25);
  }
  .day-summary { font-size: 13px; color: rgba(255,255,255,0.75); line-height: 1.6; }
  .today-badge {
    display: inline-block;
    background: #e63946;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 10px;
    font-weight: 700;
    margin-left: 6px;
    vertical-align: middle;
  }
  .score-grid {
    background: rgba(255,255,255,0.04);
    border-radius: 14px;
    padding: 16px;
    margin-top: 20px;
  }
  .score-grid-title {
    font-size: 13px;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 2px;
    margin-bottom: 12px;
  }
  .score-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 8px;
    font-size: 12px;
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.75);
  }
  .score-row:last-child { border-bottom: none; }
  .score-row.header { color: rgba(255,255,255,0.4); font-size: 11px; font-weight: 700; }
  .score-row .conservative { color: #6b7280; }
  .score-row .target { color: #f4a261; font-weight: 700; }
  .score-row .sprint { color: #4ade80; }

  /* Scrollbar */
  .modal-body::-webkit-scrollbar { width: 4px; }
  .modal-body::-webkit-scrollbar-track { background: transparent; }
  .modal-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
</style>
</head>
<body>

<!-- Stars background -->
<div class="stars" id="stars"></div>

<div class="container">

        <div class="cd-label">天</div>

      <div class="cd-sep">:</div>
      <div class="cd-unit">
        <div class="cd-num" id="cd-hours">--</div>

</div>

    <div class="modal-body" id="today-modal-body"></div>
  </div>
</div>

<!-- FULL PLAN MODAL -->
<div class="modal-overlay" id="modal-full" onclick="closeModal('modal-full', event)">

    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">🗓️ 完整28天复习计划</div>
      <button class="modal-close" onclick="closeModal('modal-full')">✕</button>
    </div>
    <div class="modal-body" id="full-modal-body"></div>
  </div>
</div>

// ===== HELPERS =====
function getDayNumber() {
  const now = new Date();
  const start = new Date('2026-05-10T00:00:00');
  const diff = now - start;
  if (diff < 0) return 0; // Before plan starts
  const day = Math.floor(diff / (1000*60*60*24)) + 1;
  return Math.min(day, 28);
}

function getPlanDate(dayNum) {
  const d = new Date('2026-05-10');
  d.setDate(d.getDate() + dayNum - 1);
  return d.toLocaleDateString('zh-CN', { month:'long', day:'numeric', weekday:'short' });
}

// ===== COUNTDOWN =====
function updateCountdown() {
  const now = new Date();
  const diff = EXAM_DATE - now;
  if (diff <= 0) {
    document.getElementById('cd-days').textContent = '0';
    document.getElementById('cd-hours').textContent = '00';
    document.getElementById('cd-mins').textContent = '00';
    return;
  }
  const days  = Math.floor(diff / (1000*60*60*24));
  const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
  const mins  = Math.floor((diff % (1000*60*60)) / (1000*60));
  const secs  = Math.floor((diff % (1000*60)) / 1000);
  document.getElementById('cd-days').textContent  = days;
  document.getElementById('cd-hours').textContent = String(hours).padStart(2,'0');
  document.getElementById('cd-mins').textContent  = String(mins).padStart(2,'0');

  // Progress: from plan start (May 10) to exam (June 7) = 28 days
  const planStart = new Date('2026-05-10T00:00:00');
  const totalDuration = EXAM_DATE - planStart;
  const elapsed = now - planStart;
  const progress = Math.max(0, Math.min(100, (elapsed / totalDuration) * 100));
  document.getElementById('progress-bar').style.width = progress.toFixed(1) + '%';
  const dayN = getDayNumber();
  if (dayN > 0 && dayN <= 28) {
    document.getElementById('progress-text').textContent = `复习进度 Day ${dayN} / 28`;
  } else if (dayN === 0) {
    document.getElementById('progress-text').textContent = '计划明天（5月10日）正式开始';
  } else {
    document.getElementById('progress-text').textContent = '计划完成，加油！';
  }
}
setInterval(updateCountdown, 1000);
updateCountdown();

// ===== MODAL =====
function closeModal(id, evt) {
  if (evt && evt.target !== document.getElementById(id)) return;
  document.getElementById(id).classList.remove('active');
}

function openToday() {
  const dayN = getDayNumber();
  const titleEl = document.getElementById('today-modal-title');
  const bodyEl = document.getElementById('today-modal-body');

  if (dayN === 0) {
    titleEl.textContent = '📋 今日计划';
    bodyEl.innerHTML = `<div class="no-plan">🌙 计划将于<strong> 明天（5月10日）</strong> 正式启动<br>好好休息，明天全力出发！</div>`;
  } else if (dayN > 28) {
    titleEl.textContent = '📋 今日计划';
    bodyEl.innerHTML = `<div class="no-plan">🎉 28天计划已全部完成！<br>你已经做好了充分准备<br>明天高考，全力以赴！💪</div>`;
  } else {
    const plan = dailyPlans[dayN - 1];
    titleEl.textContent = `📋 今日计划 · Day ${plan.day}`;
    bodyEl.innerHTML = renderTodayPlan(plan);
  }
  document.getElementById('modal-today').classList.add('active');
}

function renderTodayPlan(plan) {
  const morningTasks = plan.morning.map(t =>
    `<div class="task-item"><span class="task-emoji">${t.emoji}</span><span>${t.text}</span></div>`
  ).join('');
  const afternoonTasks = plan.afternoon.map(t =>
    `<div class="task-item"><span class="task-emoji">${t.emoji}</span><span>${t.text}</span></div>`
  ).join('');

  const weekTips = {
    1: '✅ 三角函数第15题（13分）是最易拿满的大题，Day4-5要专项练透\n⚠️ 多选题每题6分，本周先熟悉题型格式',

    3: '✅ 解析几何第19题(1)求曲线方程——必须全对，是送分项\n⚠️ 解析几何每题运算量大，做大题时严格计时（每道控制15分钟）',
    4: '✅ 答题顺序建议：15→18→16→17→19（由易到难）\n⚠️ 最后两天（Day27-28）不做新题，浏览公式卡+错题本保持状态',
  };

  return `
    <div class="day-badge">Day ${plan.day} · 第${plan.week}周 · ${plan.weekday}</div>
    <div class="day-date">${getPlanDate(plan.day)}</div>

    <div class="time-block morning">
      <div class="time-block-title">☀️ 上午 · 约2小时</div>
      ${morningTasks}
    </div>

    <div class="time-block afternoon">
      <div class="time-block-title">🌙 下午 / 晚上 · 约2~3小时</div>
      ${afternoonTasks}
    </div>

      <strong>📌 第${plan.week}周提示</strong><br>
      ${weekTips[plan.week].replace(/\n/g, '<br>')}

  `;
}

    bodyEl.innerHTML = renderTodayPlan(plan);
    document.getElementById('modal-today').classList.add('active');
  }, 200);
}
